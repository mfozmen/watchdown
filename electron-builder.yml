# electron-builder packaging config. Produces installers from the electron-vite build:
# Windows (NSIS), macOS (dmg), and Linux (AppImage) — each built on its own OS by the release
# workflow (.github/workflows/release-please.yml) when a release-please release is cut. No build
# carries a real certificate yet (macOS is only ad-hoc signed).
appId: com.mfozmen.watchdown
productName: Watchdown
copyright: © mfozmen — MIT
# electron-builder itself never publishes; the release-please workflow attaches the artifacts to
# the GitHub Release (keeps a local `npm run dist` side-effect-free).
publish: null
directories:
  output: release
  # icon.ico (Windows) + icon.png (macOS/Linux; electron-builder derives .icns) live here.
  # The default is build/, which is gitignored as build output — hence a tracked dir.
  buildResources: build-resources
# out/** is the electron-vite build; package.json carries "main" and the runtime deps
# (chokidar) that the main process requires externally. icon.png is bundled so the running app
# can set it as the BrowserWindow icon at runtime; the main process resolves it relative to its
# own module dir (out/main/../../build-resources), which lands inside the asar here.
files:
  - out/**/*
  - package.json
  - build-resources/icon.png
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
# One-click = per-user install under %LOCALAPPDATA%\Programs: never elevates, on install or upgrade.
nsis:
  oneClick: true
  perMachine: false
mac:
  target: dmg
  # Ad-hoc signature: Apple Silicon reports a completely unsigned app as "damaged". Hardened
  # runtime is off because under an ad-hoc identity its library validation blocks launch.
  identity: '-'
  hardenedRuntime: false
  category: public.app-category.productivity
# No /Applications shortcut: the app installs itself into ~/Applications when opened from the
# image (installForUserOnMac in src/main/index.ts), so nothing needs dragging.
dmg:
  contents:
    - x: 270
      y: 190
      type: file
linux:
  target: AppImage
  category: Utility
