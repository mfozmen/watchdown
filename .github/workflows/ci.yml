name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gate:
    name: Type check & tests
    runs-on: ubuntu-latest
    # CI only type-checks and runs the pure tests; it never launches Electron, so skip
    # the ~100 MB Electron binary download (its TypeScript types ship in the package).
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the comment check diffs against main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Test CI scripts
        run: python3 .github/scripts/test_review_range.py

      # Warning-only: lists narrative comments the PR adds; pass --strict to fail the job instead.
      - name: Check comments
        run: python3 scripts/check_comments.py origin/${{ github.base_ref || 'main' }}..HEAD
