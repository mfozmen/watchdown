name: macOS package

# The macOS installer is otherwise only built at release time, so a broken signature or
# self-install would first show up on a user's Mac.

on:
  pull_request:
    branches: [main]
    paths:
      - electron-builder.yml
      - package-lock.json
      - src/main/**
      - src/core/mac-install.ts
      - .github/workflows/mac-package.yml

jobs:
  mac-package:
    name: macOS installer
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build distributable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: true # electron-builder skips signing on pull requests otherwise

      - name: The app opened from the dmg installs itself for the user
        run: |
          installed="$HOME/Applications/Watchdown.app"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" release/*.dmg
          test ! -e "$RUNNER_TEMP/dmg/Applications"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Watchdown.app"
          "$RUNNER_TEMP/dmg/Watchdown.app/Contents/MacOS/Watchdown" &
          for _ in $(seq 30); do
            pgrep -f "$installed/Contents/MacOS/Watchdown" && break
            sleep 1
          done
          pgrep -f "$installed/Contents/MacOS/Watchdown"
          codesign --verify --deep --strict "$installed"
          pkill -f "$installed" || true
          hdiutil detach "$RUNNER_TEMP/dmg" -force

      # The app watches the file it has open, so the open descriptor shows the file arrived.
      - name: A markdown file opened in Finder's way reaches the app
        run: |
          while pgrep -f "$HOME/Applications/Watchdown.app" > /dev/null; do sleep 1; done
          echo '# note' > "$RUNNER_TEMP/note.md"
          open -a "$HOME/Applications/Watchdown.app" "$RUNNER_TEMP/note.md"
          for _ in $(seq 30); do
            lsof -c Watchdown | grep -q note.md && break
            sleep 1
          done
          lsof -c Watchdown | grep note.md
          pkill -f "$HOME/Applications/Watchdown.app" || true
