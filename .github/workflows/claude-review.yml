name: Claude Review

# Advisory AI code review using anthropics/claude-code-action@v1.
#
# Auth: the Claude SUBSCRIPTION via claude_code_oauth_token — NOT an API key.
# There is intentionally no Anthropic API key anywhere in this repo, so reviews
# draw from the subscription quota rather than pay-as-you-go billing.
#
# This workflow is advisory only: it never approves or blocks a PR. The real
# gate is ci.yml.

on:
  # Review on open/reopen/ready AND on every push (`synchronize`). The
  # `claude-review` branch-protection check is required on the head commit, so
  # the review must re-run per push to keep the PR mergeable. This consumes
  # subscription quota on each push; the concurrency block below cancels an
  # in-flight review when a newer push arrives to limit the cost.
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # On-demand re-review by commenting @claude on the PR.
  issue_comment:
    types: [created]

# Cancel an in-flight review for the same PR when a newer trigger arrives.
concurrency:
  # Scope by event type as well as PR number so a comment-triggered run
  # (issue_comment) never shares a group with — and thus cancels — an in-flight
  # pull_request review. Without the event-name segment, any PR comment (e.g.
  # SonarCloud's quality-gate comment) fires issue_comment and cancels the
  # running review. Keep the PR-number `||` fallback: the number lives at
  # pull_request.number on pull_request events but issue.number on issue_comment.
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork safety: use `pull_request` (never `pull_request_target`) and only run
    # when the PR head repo is THIS repo, so the subscription token and quota are
    # never exposed to forked PRs. For comment-triggered runs, require an actual
    # PR comment containing @claude AND restrict it to collaborators-and-above so
    # arbitrary users can't spend subscription quota by commenting @claude.
    if: >
      ( github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository ) ||
      ( github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # What to review: only what changed since the reviewer's last finished comment, whose
      # REVIEWED-HEAD line is the notebook. Falls back to the whole PR on a first review or when
      # a force-push made that head unreachable. Tested: .github/scripts/test_review_range.py.
      - name: Review range
        id: range
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 .github/scripts/review_range.py

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth — do NOT add an Anthropic API key here.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Guarantees a visible result: the action writes the agent's output into its own
          # tracking comment, independent of the agent's permission to run `gh pr comment`.
          track_progress: true
          # Cost control: cap the agent loop. timeout-minutes (15) and the per-PR
          # concurrency cancel remain the hard ceilings.
          #
          # allowedTools is what lets the reviewer read and publish. Read/Grep/Glob and the git
          # read commands are required: without them every file inspection is denied and the
          # run finishes green having posted nothing (seen after the action's v1 tag moved).
          claude_args: |
            --max-turns 50
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          prompt: |
            REVIEW RANGE — mode: ${{ steps.range.outputs.mode }}
              head under review: ${{ steps.range.outputs.head }}
              last reviewed head: ${{ steps.range.outputs.base }}
              this PR's own new commits since then:
            ${{ steps.range.outputs.commits }}

            What the mode means:
            - full: the first review, or the earlier head is gone (rebase or
              force-push) — review the whole PR diff with `gh pr diff`.
            - incremental: review ONLY the commits listed above, one
              `git show <sha>` each. Do not re-review the rest of the PR; it
              was reviewed at the last head. Merges from main are left out on
              purpose — they are main's code, already reviewed there.
            - unchanged: no new commits since the last review. Re-check the
              open findings below and nothing else.

            Your previous summary is in ${{ steps.range.outputs.prev }} (empty
            on a first review). Read it first. For each finding it left open,
            say in one line whether the new commits closed it or it is still
            open. Never raise a new finding on lines the reviewed range did not
            touch, and never re-raise a finding the author already answered or
            declined — no review-fix loop.

            You are reviewing this pull request as an ADVISORY reviewer for the
            Watchdown project. You must NOT approve or block the PR — leave the
            verdict to the human and to the deterministic CI gate.

            How to publish your review:
            - Use `mcp__github_inline_comment__create_inline_comment` to leave
              inline comments on the specific changed lines for concrete findings.
            - Write the review summary into your tracking comment via
              `mcp__github_comment__update_claude_comment` — that is the
              guaranteed publication channel. Always write it, even if you find
              nothing notable (say so briefly). Use `gh pr comment` only as a
              fallback if the tracking-comment tool is unavailable.

            Review the diff against the standards recorded in CLAUDE.md:

            - TDD discipline: production code should be backed by a test that was
              written first; minimal implementations, no speculative features.
            - Architecture: the sync engine core (src/core/) must stay PURE
              TypeScript with zero Electron/DOM/filesystem dependencies. Electron,
              CodeMirror, and chokidar belong in thin adapter layers, not the core.
            - Conventional Commits: every commit follows
              `type(scope): description` with an imperative, lowercase subject.
            - Project requirements: changes should be consistent with the spec in
              CLAUDE.md, including the live multi-author presence and git-style
              3-way-merge / authorship-attribution requirement (diff-based, since
              external tools only write finished files to disk — no op stream or
              live cursor).
            - Comments: a comment the range adds or changes that narrates the code
              is at most a Suggestion. List them all in ONE finding, once, and
              never raise a comment again in a later review.

            Group every finding by severity:
              - **Critical**: correctness bugs, architecture violations (e.g.
                Electron/DOM/fs leaking into src/core/), or broken TDD/commit rules.
              - **Warning**: risky or non-idiomatic code that should be addressed.
              - **Suggestion**: optional improvements and nitpicks.

            Be concise and specific, and always cite the file and line.

            THE LAST LINE of your summary is the head you reviewed, exactly:

                REVIEWED-HEAD: ${{ steps.range.outputs.head }}

            The next review starts from it; copy the sha exactly as given.

            Spend your turns economically (the run is turn-budgeted): fetch the
            range once (`gh pr diff` in full mode, `git show` per listed commit
            otherwise) and don't re-fetch; leave inline comments only for the
            handful of most important issues; then write the summary last so it
            always lands.

            IMPORTANT — command form: you are already in the repository root.
            Run every command bare and alone (e.g. `gh pr diff 19`), NEVER
            prefixed with `cd`, chained with `&&`/`;`, piped, or in subshells —
            the tool allowlist matches the exact command start, and anything
            else is denied.
